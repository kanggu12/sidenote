<text x="14" y="183.75" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="14,136">program sends</text>
<text x="14" y="201.25" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="14,136">one frame</text>
