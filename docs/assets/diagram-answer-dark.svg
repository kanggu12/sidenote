<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958 396" width="958" height="396" font-family="'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="The screen settles and the capture program sends a frame; the server covers faces and checks whether the problem is new; the local model's fast pass, about a second on the GPU, decides: nothing to solve, answered at once, or a hard problem for the cloud agent or the local model's thinking pass; a code answer is then run on the problem's examples">
