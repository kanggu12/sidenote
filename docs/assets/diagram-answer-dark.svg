<text x="188" y="166.25" font-size="12.5" fill="#b0b1b4" text-anchor="start" data-box="188,310">faces covered,</text>
<text x="188" y="183.75" font-size="12.5" fill="#b0b1b4" text-anchor="start" data-box="188,310">then compared</text>
