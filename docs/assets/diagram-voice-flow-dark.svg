<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958 738" width="958" height="738" font-family="'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="A spoken problem: the capture program sends the speaker sound; every two seconds the server finds speech in it, and once a speaker pauses the transcriber writes the utterance down, with technical terms as hints, and the line can be kept on this PC; speech that asks the listener nothing, such as a story or a tag question, gets a note under its line; a question is solved at once with a question word, otherwise after six seconds, and waits behind an answer being written; the local model's fast pass answers, or the agent gets the question written out; the answer reaches the panel">
