<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958 336" width="958" height="336" font-family="'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="A finding (real use, a review, a log) becomes a check that fails on the commit before; tests/run.sh runs every suite on this PC; a push runs ci.yml, which ends in one verdict, the QA gate; on main, ./sidenote up with SIDENOTE_CI_GATE=1 refuses a commit CI failed; on a version tag, release.yml also waits for the chart on a cluster and the desktop build, then publishes">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#e6e6e6"/></pattern><filter id="relief" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="1.6" dy="2" stdDeviation="2.4" flood-color="#1d1c1d" flood-opacity="0.09"/></filter></defs>
<rect x="0.5" y="0.5" width="957" height="335" rx="14" fill="#f8f8f8" stroke="#dddddd"/><rect x="0.5" y="0.5" width="957" height="335" rx="14" fill="url(#dots)"/><path d="M22,1 V335" stroke="#f3a5bd" stroke-width="1.5"/>
<g transform="translate(40,18)">
<rect x="0" y="20" width="210" height="96" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#relief)"/>
<text x="14" y="54.2" font-size="14" font-weight="620" fill="#1d1c1d" text-anchor="start" data-box="14,196">A failing check</text>
<text x="14" y="73" font-size="12.5" fill="#616061" text-anchor="start" data-box="14,196">each finding first becomes</text>
<text x="14" y="90.5" font-size="12.5" fill="#616061" text-anchor="start" data-box="14,196">a check that fails without it</text>
<rect x="230" y="20" width="210" height="96" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#relief)"/>
<text x="244" y="54.2" font-size="14" font-weight="620" fill="#1d1c1d" text-anchor="start" data-box="244,426">tests/run.sh</text>
<text x="244" y="73" font-size="12.5" fill="#616061" text-anchor="start" data-box="244,426">every suite on this PC</text>
<text x="244" y="90.5" font-size="12.5" fill="#616061" text-anchor="start" data-box="244,426">(./sidenote qa)</text>
<path d="M210.5,68 L222.5,68" fill="none" stroke="#8f8e90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M229.5,68 L221.0,72.2 L221.0,63.8 Z" fill="#8f8e90" stroke="#8f8e90" stroke-width="0.8" stroke-linejoin="round" data-tip="229.5,68"/>
<rect x="460" y="20" width="210" height="96" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#relief)"/>
<text x="474" y="54.2" font-size="14" font-weight="620" fill="#1d1c1d" text-anchor="start" data-box="474,656">git push</text>
<text x="474" y="73" font-size="12.5" fill="#616061" text-anchor="start" data-box="474,656">ci.yml: the syntax, the</text>
<text x="474" y="90.5" font-size="12.5" fill="#616061" text-anchor="start" data-box="474,656">suites, images and chart</text>
<path d="M440.5,68 L452.5,68" fill="none" stroke="#8f8e90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M459.5,68 L451.0,72.2 L451.0,63.8 Z" fill="#8f8e90" stroke="#8f8e90" stroke-width="0.8" stroke-linejoin="round" data-tip="459.5,68"/>
<rect x="690" y="20" width="210" height="96" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#relief)"/>
<text x="704" y="54.2" font-size="14" font-weight="620" fill="#1d1c1d" text-anchor="start" data-box="704,886">QA gate</text>
<text x="704" y="73" font-size="12.5" fill="#616061" text-anchor="start" data-box="704,886">one verdict for the</text>
<text x="704" y="90.5" font-size="12.5" fill="#616061" text-anchor="start" data-box="704,886">whole commit</text>
<path d="M670.5,68 L682.5,68" fill="none" stroke="#8f8e90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M689.5,68 L681.0,72.2 L681.0,63.8 Z" fill="#8f8e90" stroke="#8f8e90" stroke-width="0.8" stroke-linejoin="round" data-tip="689.5,68"/>
<rect x="40" y="190" width="400" height="92" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#relief)"/>
