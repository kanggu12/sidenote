<text x="54" y="241" font-size="12.5" fill="#616061" text-anchor="start" data-box="54,426">./sidenote up deploys it; with SIDENOTE_CI_GATE=1,</text>
<text x="54" y="258.5" font-size="12.5" fill="#616061" text-anchor="start" data-box="54,426">it refuses a commit CI failed</text>
<rect x="470" y="190" width="430" height="92" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#relief)"/>
<text x="484" y="222.2" font-size="14" font-weight="620" fill="#1d1c1d" text-anchor="start" data-box="484,886">On a version tag</text>
<text x="484" y="241" font-size="12.5" fill="#616061" text-anchor="start" data-box="484,886">release.yml also waits for the chart on a cluster</text>
<text x="484" y="258.5" font-size="12.5" fill="#616061" text-anchor="start" data-box="484,886">and the desktop build, then publishes</text>
