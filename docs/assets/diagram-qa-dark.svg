<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 906 306" width="906" height="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="A finding (real use, a review, a log) becomes a check that fails on the commit before; tests/run.sh runs every suite on this PC; a push runs ci.yml, which ends in one verdict, the QA gate; on main, ./sidenote up with SIDENOTE_CI_GATE=1 refuses a commit CI failed; on a version tag, release.yml also waits for the chart on a cluster and the desktop build, then publishes">
<rect x="0" y="20" width="210" height="96" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
