<text x="244" y="73" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="244,426">every suite on this PC</text>
<text x="244" y="90.5" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="244,426">(./sidenote qa)</text>
