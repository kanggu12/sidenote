<text x="14" y="73" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="14,196">each finding first becomes</text>
<text x="14" y="90.5" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="14,196">a check that fails without it</text>
