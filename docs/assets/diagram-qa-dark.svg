<text x="704" y="73" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="704,886">one verdict for the</text>
<text x="704" y="90.5" font-size="12.5" fill="#9198a1" text-anchor="start" data-box="704,886">whole commit</text>
