<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 906 476" width="906" height="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="app.py holds the connections and the one analysis worker. It calls the screen and sound modules (detector and gate, faces, transcriber) and pipeline.py, which solves one problem with repeats.py. The pipeline uses the engines: analyzer.py for the local model, agents.py for the cloud agents, codecheck.py with checklangs/ for code checks, search.py for web search. Everything reads settings.py and config.py; models.py and hardware.py pick the model; history.py and telemetry.py keep answers and logs">
