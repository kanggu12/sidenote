<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 906 442" width="906" height="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="When no answer comes, four questions in turn. The panel does not open: Nothing appears after starting it, or Server disconnected with Docker. Screen capture is not green on the capture card: Capture program not connected, or No program. Neither the local model nor the agent is ready: Ollama does not answer, No local model yet, or Agent sign-in needed. The screen changed outside the problem: it did not solve again, and Reanalyze solves it at once. With all four, Sidenote answers">
<rect x="0" y="0" width="372" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="14" y="23.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="14,358">No answer appears</text>
<text x="14" y="42.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,358">after a screen with a problem on it</text>
<path d="M40,56 L40,69" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M40,76 L35.5,67.0 L44.5,67.0 Z" fill="#818b98" data-tip="40,76"/>
<rect x="0" y="76" width="372" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="5 4"/>
