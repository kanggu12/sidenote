<text x="506" y="346.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="506,886">Reanalyze solves it at once</text>
<path d="M40,360 L40,373" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M40,380 L35.5,371.0 L44.5,371.0 Z" fill="#818b98" data-tip="40,380"/>
<text x="50" y="374" font-size="12" fill="#59636e" text-anchor="start" data-box="50,120">yes</text>
<rect x="0" y="380" width="372" height="56" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
<text x="14" y="403.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="14,358">Sidenote answers</text>
<text x="14" y="422.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,358">the local model first, the agent for the hard ones</text>
</svg>
