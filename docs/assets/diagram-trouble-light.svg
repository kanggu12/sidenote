<path d="M492,104 L483.0,108.5 L483.0,99.5 Z" fill="#818b98" data-tip="492,104"/>
<text x="432" y="96" font-size="12" fill="#59636e" text-anchor="middle" data-box="382,482">no</text>
<rect x="492" y="76" width="408" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="506" y="99.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="506,886">Nothing appears after starting it</text>
<text x="506" y="118.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="506,886">or Server disconnected, with Docker</text>
<path d="M40,132 L40,145" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M40,152 L35.5,143.0 L44.5,143.0 Z" fill="#818b98" data-tip="40,152"/>
<text x="50" y="146" font-size="12" fill="#59636e" text-anchor="start" data-box="50,120">yes</text>
<rect x="0" y="152" width="372" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="5 4"/>
<text x="14" y="175.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="14,358">Screen capture is green?</text>
<text x="14" y="194.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,358">on the capture card</text>
<path d="M372,180 L485,180" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M492,180 L483.0,184.5 L483.0,175.5 Z" fill="#818b98" data-tip="492,180"/>
<text x="432" y="172" font-size="12" fill="#59636e" text-anchor="middle" data-box="382,482">no</text>
<rect x="492" y="152" width="408" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="506" y="175.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="506,886">Capture program not connected</text>
<text x="506" y="194.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="506,886">or No program, on the capture card</text>
<path d="M40,208 L40,221" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M40,228 L35.5,219.0 L44.5,219.0 Z" fill="#818b98" data-tip="40,228"/>
<text x="50" y="222" font-size="12" fill="#59636e" text-anchor="start" data-box="50,120">yes</text>
<rect x="0" y="228" width="372" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="5 4"/>
<text x="14" y="251.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="14,358">The local model or the agent ready?</text>
<text x="14" y="270.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,358">their cards in the right column</text>
