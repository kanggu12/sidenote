<text x="432" y="248" font-size="12" fill="#59636e" text-anchor="middle" data-box="382,482">no</text>
<rect x="492" y="228" width="408" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="506" y="251.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="506,886">Ollama does not answer</text>
<text x="506" y="270.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="506,886">No local model yet, or Agent sign-in needed</text>
<path d="M40,284 L40,297" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M40,304 L35.5,295.0 L44.5,295.0 Z" fill="#818b98" data-tip="40,304"/>
<text x="50" y="298" font-size="12" fill="#59636e" text-anchor="start" data-box="50,120">yes</text>
<rect x="0" y="304" width="372" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="5 4"/>
<text x="14" y="327.25" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="14,358">The screen changed inside the problem?</text>
<text x="14" y="346.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,358">the part the answer points at</text>
<path d="M372,332 L485,332" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M492,332 L483.0,336.5 L483.0,327.5 Z" fill="#818b98" data-tip="492,332"/>
<text x="432" y="324" font-size="12" fill="#59636e" text-anchor="middle" data-box="382,482">no</text>
