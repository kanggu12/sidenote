<text x="614" y="55.5" font-size="12.5" fill="#59636e" text-anchor="start" data-box="614,886">Ollama on your GPU,</text>
<text x="614" y="73" font-size="12.5" fill="#59636e" text-anchor="start" data-box="614,886">web search when it needs it</text>
<rect x="600" y="123" width="300" height="84" rx="10" fill="#f6f8fa" stroke="#eb6834" stroke-width="2"/>
<text x="614" y="151.5" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="614,886">Cloud agent</text>
<text x="614" y="170.5" font-size="12.5" fill="#59636e" text-anchor="start" data-box="614,886">Claude Code, Codex</text>
<text x="614" y="188" font-size="12.5" fill="#59636e" text-anchor="start" data-box="614,886">or the Anthropic API</text>
<rect x="600" y="238" width="300" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="614" y="266.5" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" data-box="614,886">Code runner</text>
<text x="614" y="285.5" font-size="12.5" fill="#59636e" text-anchor="start" data-box="614,886">runs code answers on the</text>
<text x="614" y="303" font-size="12.5" fill="#59636e" text-anchor="start" data-box="614,886">problem's examples, no network</text>
