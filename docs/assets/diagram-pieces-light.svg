<text x="14" y="55.5" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,166">screen, speaker sound,</text>
<text x="14" y="73" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,166">the list of windows</text>
<rect x="0" y="238" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
