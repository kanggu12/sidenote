<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 906 382" width="906" height="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="The capture program sends frames, sound and the window list to the Sidenote server; the server sends every screen to the local vision model on your GPU, the hard problems to the cloud agent, and code answers to the code runner; the panel shows the answers">
<rect x="0" y="8" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
