<text x="314" y="144.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="314,466">covers faces</text>
<text x="314" y="161.75" font-size="12.5" fill="#59636e" text-anchor="start" data-box="314,466">finds the problem</text>
<text x="314" y="179.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="314,466">sends it to a model</text>
<text x="314" y="196.75" font-size="12.5" fill="#59636e" text-anchor="start" data-box="314,466">checks code answers</text>
<text x="314" y="214.25" font-size="12.5" fill="#59636e" text-anchor="start" data-box="314,466">keeps the answers</text>
<rect x="600" y="8" width="300" height="84" rx="10" fill="#f6f8fa" stroke="#2a78d6" stroke-width="2"/>
