<text x="14" y="285.5" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,166">in your browser:</text>
<text x="14" y="303" font-size="12.5" fill="#59636e" text-anchor="start" data-box="14,166">answers as written</text>
<rect x="300" y="8" width="180" height="314" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
