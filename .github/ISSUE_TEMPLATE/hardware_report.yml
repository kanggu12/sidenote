name: Hardware report
description: How Sidenote ran on your PC and GPU. Every report helps pick better defaults.
title: "Hardware: "
labels: [hardware]
body:
  - type: input
    id: system
    attributes:
      label: OS, CPU and memory
      placeholder: Ubuntu 24.04, Ryzen 7 7700, 32 GB
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and its memory
      placeholder: AMD Radeon RX 7900 XT, 20 GB (or "none")
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: The local model Sidenote picked, and the one you ended up using
      placeholder: gemma4:e4b, kept it
  - type: textarea
    id: how
    attributes:
      label: How it went
      description: Did it start without changes? How long did the first answer to an easy question take (the panel's card shows it)? Anything you had to change?
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: What Sidenote found
      description: From a checkout, the output of `python -m server.hardware --json`, or of `./sidenote doctor`. With the app, the local model's card in the panel (its model and GPU lines).
      render: text
