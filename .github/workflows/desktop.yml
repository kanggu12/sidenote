# The desktop app (desktop/): Sidenote as one folder with its own Python, built with PyInstaller on Windows, macOS
# (Apple silicon) and Linux. Each build is started with --check, which runs its server with stand-in models and fails
# when the build left something out; the Mac build also runs its capture program against its server, and is then
# opened as the Finder opens it, opened again and quit as macOS quits it (tests/mac_app_open.py). The zips are kept
# with the run; a version tag attaches them to the GitHub release (release.yml).
name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "server/**"
      - "client/**"
      - "panel/**"
      - "docker/vendor.json"
      - "docker/fetch_vendor.py"
      - "docker/constraints.txt"
      - "tests/desktop_check.py"
      - "tests/mac_app_open.py"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "client/**"
      - "panel/**"
      - "docker/vendor.json"
      - "docker/fetch_vendor.py"
      - "docker/constraints.txt"
      - "tests/desktop_check.py"
      - "tests/mac_app_open.py"
      - ".github/workflows/desktop.yml"
  workflow_call:       # release.yml builds the zips it attaches with this
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: the app on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest runner there is: the app runs on the glibc it was built with and newer, so built on
        # 22.04 (glibc 2.35) it also runs on Ubuntu 22.04 and Debian 12, which a 24.04 build (2.38) refused.
        # macOS 15 on Apple silicon: the Mac app is for Apple silicon (desktop/build.py prints the oldest macOS it takes)
        os: [windows-2025, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"          # the server image's Python
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            client/requirements.txt
            desktop/requirements-build.txt
            docker/constraints.txt
      - name: The server's packages, pinned as the image pins them, and the capture program's
        shell: bash
        run: |
          python -m pip install -r server/requirements.txt -r server/requirements-audio.txt -c docker/constraints.txt
          python -m pip install -r client/requirements.txt     # the capture program, part of the app on each
          python -m pip install -r desktop/requirements-build.txt
      - name: The panel's libraries, checked against their checksums
        run: python docker/fetch_vendor.py docker/vendor.json panel/vendor
      - name: The desktop suite, from the checkout
        run: python tests/desktop_check.py
      - name: The Mac's GPU, as the server reads it to pick a model
        if: runner.os == 'macOS'
        run: |
          python -m server.hardware
          python -m server.hardware --json | python -c "import json,sys; g=json.load(sys.stdin)['best']; assert g and g['vendor'] == 'apple' and g['memory_gb'] > 0, g"
      - name: Build, then start the build with --check
        run: python desktop/build.py
      - name: The Mac app opened as the Finder opens it, opened again while it runs, and quit as macOS quits it
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: python tests/mac_app_open.py dist/Sidenote.app
      - uses: actions/upload-artifact@v7
        with:
          name: Sidenote-${{ runner.os }}
          path: dist/Sidenote-*.zip
          retention-days: 14
