# A version tag (v1.2.3) publishes a release: both images to the GitHub Container Registry, the Helm chart as an OCI
# artifact and a .tgz, and the files attached to the GitHub release, each named for its part, the release and the system,
# every letter lowercase: the server (the desktop app, with its panel and this PC's capture program) for Windows, macOS and
# Linux and its Helm chart, sidenote-server-1.2.3-windows-x64.zip and sidenote-server-1.2.3-helm-chart.tgz; the capture
# program alone for the same three (desktop.yml builds both), sidenote-capture-1.2.3-macos-arm64.zip, and as a wheel for
# any system with Python, sidenote_capture-1.2.3-py3-none-any.whl (the wheel format's own name: an underscore, and
# py3-none-any for any Python 3 on any system); and sidenote-1.2.3-sha256sums.txt.
# A tag with a pre-release part (v1.2.3-rc.1) publishes as a pre-release, with no `latest` images.
#
# The published server image carries the Codex CLI (Apache-2.0) and not Claude Code, which is Anthropic's to
# distribute: the chart fetches Claude Code into the pod when it starts (WITH_CLAUDE_CODE below).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write      # the GitHub release and its files
  packages: write      # the images and the chart in ghcr.io

jobs:
  # What a tag must have before anything is built: one version in the tag, server/version.py and the chart, and this
  # version's section of CHANGELOG.md, which is the release's notes
  notes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: The tag, server/version.py and the chart name one version
        run: python3 .github/check_version.py "$GITHUB_REF_NAME"
      - name: The release notes, from CHANGELOG.md
        run: |
          python3 .github/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # any v*.*.* tag published images and `latest`, on a failing commit too
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # what only a running cluster shows: a chart that renders can still not come up
  chart:
    uses: ./.github/workflows/chart-e2e.yml
    permissions:
      contents: read

  # the desktop app, built and started with --check on each system; its zips come back as this run's artifacts
  desktop:
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read

  release:
    needs: [notes, checks, chart, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # the GitHub release and its files
      packages: write      # the images and the chart in ghcr.io
      id-token: write      # the build provenance below, signed through GitHub's OIDC token
      attestations: write
      discussions: write   # the release's announcement in Discussions
    steps:
      - uses: actions/checkout@v7
      - name: Version and names
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # A tag such as v1.2.3-rc.1 is a pre-release: marked as one, so the README's latest-release links and the
          # panel's new-version line pass over it, and without the images' `latest`, which people pull as the release.
          case "$GITHUB_REF_NAME" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Claude Code is Anthropic's to distribute: left out of the published image, fetched by a pod when it starts
          build-args: |
            WITH_CLAUDE_CODE=0
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/sidenote:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.pre == 'false' && format('ghcr.io/{0}/sidenote:latest', steps.v.outputs.owner) || '' }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Code runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runner/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/sidenote-runner:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.pre == 'false' && format('ghcr.io/{0}/sidenote-runner:latest', steps.v.outputs.owner) || '' }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Helm chart, versioned with the release and pointing at its images
        run: |
          # the packaged chart pulls this release's images from ghcr.io instead of the local names it ships with
          sed -i -e "s#^    repository: sidenote\$#    repository: ghcr.io/${{ steps.v.outputs.owner }}/sidenote#" \
            -e "s#^    repository: sidenote-runner\$#    repository: ghcr.io/${{ steps.v.outputs.owner }}/sidenote-runner#" \
            deploy/helm/sidenote/values.yaml
          test "$(grep -c "repository: ghcr.io/" deploy/helm/sidenote/values.yaml)" = 2
          helm lint deploy/helm/sidenote
          helm package deploy/helm/sidenote --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/sidenote-${{ steps.v.outputs.version }}.tgz" "oci://ghcr.io/${{ steps.v.outputs.owner }}/charts"
          # the release's own copy is named as its other files are; Helm takes the chart from any file name
          cp "dist/sidenote-${{ steps.v.outputs.version }}.tgz" "dist/sidenote-server-${{ steps.v.outputs.version }}-helm-chart.tgz"
      - name: The capture program on its own, as a wheel for any system with Python
        # pip installs what it needs with it and puts a sidenote-capture command on the PATH; tests/version_check.py builds
        # one with the same script, installs it and starts it
        run: python3 .github/capture_wheel.py dist
      - name: The desktop app's and the capture program's zips, built by the desktop job
        uses: actions/download-artifact@v7
        with:
          pattern: Sidenote-*
          path: dist/app
          merge-multiple: true
      # The app is not code-signed yet: a checksum file and GitHub's own record of where each file was built are what a
      # download can be checked against (sha256sum -c sidenote-1.2.3-sha256sums.txt; gh attestation verify FILE --repo OWNER/sidenote)
      - name: Checksums of the files the release carries
        run: |
          cd dist
          { sha256sum "sidenote-server-${{ steps.v.outputs.version }}-helm-chart.tgz" "sidenote_capture-${{ steps.v.outputs.version }}-py3-none-any.whl"
            (cd app && sha256sum sidenote-*.zip); } > "sidenote-${{ steps.v.outputs.version }}-sha256sums.txt"
          cat "sidenote-${{ steps.v.outputs.version }}-sha256sums.txt"
      - name: Where each file was built, signed by GitHub
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/sidenote-server-${{ steps.v.outputs.version }}-helm-chart.tgz
            dist/sidenote_capture-${{ steps.v.outputs.version }}-py3-none-any.whl
            dist/app/sidenote-*.zip
      - name: The release notes the notes job took from CHANGELOG.md
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}         # named by its tag (v0.6.1), as the project's other releases are
          prerelease: ${{ steps.v.outputs.pre == 'true' }}
          body_path: dist/release-notes.md
          generate_release_notes: true          # adds the compare link under the notes
          discussion_category_name: Announcements
          files: |
            dist/app/sidenote-*.zip
            dist/sidenote-server-${{ steps.v.outputs.version }}-helm-chart.tgz
            dist/sidenote_capture-${{ steps.v.outputs.version }}-py3-none-any.whl
            dist/sidenote-${{ steps.v.outputs.version }}-sha256sums.txt
