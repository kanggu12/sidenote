# The winget package of a release. Its manifests are written (desktop/winget/make_manifests.py), checked by winget
# itself, installed on a Windows runner from those files, and the installed app is started through the `sidenote`
# command winget makes for it, with --check, as desktop.yml checks the build. With the WINGET_TOKEN secret set (a token
# that may open pull requests on microsoft/winget-pkgs) a release's manifests are then sent there; without it they are
# kept as an artifact. release.yml runs this after it publishes; by hand it takes a version that is already released.
name: winget

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "A published release, such as 0.1.1"
        required: true

permissions:
  contents: read

jobs:
  manifests:
    name: winget manifests, installed and started
    runs-on: windows-2025
    timeout-minutes: 30      # a start that waits on a window nobody can press ends here, not hours later
    env:
      VERSION: ${{ inputs.version }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}   # empty when the secret is not set: nothing is sent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Write the release's manifests
        id: m
        shell: pwsh
        run: |
          $dir = python desktop/winget/make_manifests.py $env:VERSION --out "$env:RUNNER_TEMP\winget"
          if ($LASTEXITCODE) { exit 1 }
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Get-ChildItem $dir | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
      - name: winget, installed when the runner image has none
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            # Microsoft's own module installs the client and what it needs, the documented way on a server
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Microsoft.WinGet.Client -Repository PSGallery -Force -AllowClobber
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
      - name: winget validates the manifests
        shell: pwsh
        run: winget validate --manifest "${{ steps.m.outputs.dir }}"
      - name: Install from them, then start the app through its command with --check
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          # Ollama is the package's dependency; the check runs with stand-in models and needs none
          winget install --manifest "${{ steps.m.outputs.dir }}" --skip-dependencies --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE) { exit 1 }
          # the command winget links to the program inside the unpacked folder: what `sidenote` starts on a user's PC
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links\sidenote.exe"
          if (-not (Test-Path $alias)) { "no sidenote command at $alias"; exit 1 }
          $item = Get-Item $alias
          "the command: $alias -> $($item.LinkType) $($item.Target)"
          # Started the way a terminal starts a command (CreateProcess, not the shell's ShellExecute, which shows the
          # downloaded-file warning first and waits on it), with five minutes each, and every line printed to the log
          function Run-Check($exe, $name) {
            $log = Join-Path $env:RUNNER_TEMP "check-$($name -replace '\W', '-').log"
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = $exe
            $info.Arguments = "--check"
            $info.UseShellExecute = $false
            $info.EnvironmentVariables["SIDENOTE_CHECK_LOG"] = $log
            $p = [System.Diagnostics.Process]::Start($info)
            if (-not $p.WaitForExit(300000)) {
              Write-Host "${name}: still running after five minutes; what runs from the package:"
              Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "*Sidenote*" } | ForEach-Object {
                Write-Host "  $($_.ProcessId) $($_.ExecutablePath) $($_.CommandLine)"
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }
              return $false
            }
            if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "  $_" } } else { Write-Host "${name}: the check wrote no report" }
            $ok = $p.ExitCode -eq 0 -and (Test-Path $log) -and ((Get-Content $log -Tail 1) -eq "ok")
            Write-Host "${name}: exit $($p.ExitCode), $(if ($ok) { 'passed' } else { 'FAILED' })"
            return $ok
          }
          $direct = Run-Check $item.Target "the program in its folder"
          $linked = Run-Check $alias "the sidenote command"
          # removed by the same manifest it was installed from: an id alone is looked up in the sources, where it is not yet
          winget uninstall --manifest "${{ steps.m.outputs.dir }}" --disable-interactivity --accept-source-agreements
          if ($LASTEXITCODE) { Write-Host "winget could not remove the package"; exit 1 }
          if (Test-Path $alias) { Write-Host "the sidenote command is still there after the removal"; exit 1 }
          if (-not ($direct -and $linked)) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests-${{ inputs.version }}
          path: ${{ runner.temp }}/winget
          retention-days: 30
      - name: Send them to microsoft/winget-pkgs
        if: ${{ env.WINGET_TOKEN != '' && github.event_name != 'workflow_dispatch' }}
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN "${{ steps.m.outputs.dir }}"
