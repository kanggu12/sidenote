{{- if and .Values.runner.enabled (not .Values.runner.existingSecret) }}
{{- $name := include "sidenote.runner.tokenSecret" . }}
{{- /* runner.token as given; else an upgrade keeps the token the release already has, and the first install, or a
render with no cluster (helm template), makes a new one (set runner.token there, values.yaml). The Secret is kept on
uninstall, so a reinstall does not hand the pods a token other than the one they run with. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The token the code runner takes runs with, shared with the server (SIDENOTE_RUNNER_TOKEN). compose needs none:
# there the runner listens on a Unix socket only the server may open.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sidenote.labels" (dict "context" . "component" "runner") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.runner.token }}
  token: {{ .Values.runner.token | toString | b64enc }}
  {{- else if and $existing $existing.data (index $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
