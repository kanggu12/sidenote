# The local model on an NVIDIA GPU (the NVIDIA Container Toolkit, or Docker Desktop with WSL 2).
# ./sidenote picks this file when nvidia-smi finds a GPU; by hand: COMPOSE_FILE=compose.yaml:docker/compose.nvidia.yaml
services:
  llm:
    # Ollama, and beside it one line of nvidia-smi every two seconds: used and total memory (MiB), load (%),
    # temperature (C) and power (W). One file rewritten whole, so it never grows; a failed reading leaves the old
    # file to go stale, and the server shows no stale reading. Ollama runs in the loop that starts it again when it
    # ends by itself (docker/keep-running.sh, which compose.yaml mounts), as compose.yaml's own entrypoint does.
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          nvidia-smi --query-gpu=memory.used,memory.total,utilization.gpu,temperature.gpu,power.draw --format=csv,noheader,nounits -i 0 > /gpu/now.tmp 2>/dev/null && mv -f /gpu/now.tmp /gpu/now.csv
          sleep 2
        done &
        exec /bin/sh /keep-running.sh /bin/ollama serve
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
